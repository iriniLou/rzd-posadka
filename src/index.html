<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Посадка на скорый поезд</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e2231a'/%3E%3Crect x='9' y='6' width='14' height='16' rx='4' fill='%23fff'/%3E%3Crect x='11' y='9' width='10' height='5' rx='1.5' fill='%23e2231a'/%3E%3Cpath d='M10 27l3-4h6l3 4' stroke='%23fff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<!--
  «Внимание! Производится посадка на скорый поезд…» — интерактив для «Разговоров о важном», СПО 2–4 курсы.
  Исходники: эта папка (src). Тексты фактов — в facts.js.
  Собрать один офлайн-файл: python build.py  →  ../index.html
-->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Иконки -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-train" viewBox="0 0 48 56">
    <rect x="8" y="2" width="32" height="34" rx="9" fill="currentColor"/>
    <rect x="13" y="8" width="22" height="12" rx="3" fill="var(--ico-cut, #e2231a)"/>
    <circle cx="15" cy="28" r="3" fill="var(--ico-cut, #e2231a)"/>
    <circle cx="33" cy="28" r="3" fill="var(--ico-cut, #e2231a)"/>
    <path d="M14 40 7 52M34 40l7 12M12 47h24" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </symbol>
  <symbol id="i-loco" viewBox="0 0 120 40">
    <path d="M6 8h70c18 0 30 8 38 22v4H6z" fill="#fff" stroke="#e2231a" stroke-width="3"/>
    <path d="M86 9c10 2 18 8 23 17H86z" fill="#e2231a"/>
    <rect x="14" y="14" width="12" height="9" rx="2" fill="#284b8f"/>
    <rect x="32" y="14" width="12" height="9" rx="2" fill="#284b8f"/>
    <rect x="50" y="14" width="12" height="9" rx="2" fill="#284b8f"/>
    <path d="M6 28h108" stroke="#e2231a" stroke-width="4"/>
    <circle cx="24" cy="36" r="3.5" fill="#1f2228"/><circle cx="44" cy="36" r="3.5" fill="#1f2228"/>
    <circle cx="80" cy="36" r="3.5" fill="#1f2228"/><circle cx="100" cy="36" r="3.5" fill="#1f2228"/>
  </symbol>
  <symbol id="i-sound" viewBox="0 0 24 24">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path class="cross" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
</svg>

<header class="top">
  <div class="logo"><svg><use href="#i-train"/></svg></div>
  <h1 id="title"></h1>
  <div class="counter" aria-live="polite">
    <span class="counter-label">верных<br>билетов</span>
    <span class="counter-val"><b id="cnt">0</b><i>/</i><span id="total">8</span></span>
  </div>
  <button class="icon-btn" id="soundBtn" type="button" aria-label="Звук" aria-pressed="true"><svg><use href="#i-sound"/></svg></button>
</header>

<main class="layout">
  <section class="scene-col">
    <div class="scene" id="scene">
      <div class="frames" id="frames">
        <img src="img/kadr1.webp" alt="" class="on">
        <img src="img/kadr2.webp" alt="">
        <img src="img/kadr3.webp" alt="">
        <img src="img/kadr4.webp" alt="">
        <img src="img/kadr5.webp" alt="">
        <img src="img/kadr6.webp" alt="">
        <img src="img/kadr7.webp" alt="">
        <img src="img/kadr8.webp" alt="">
        <img src="img/kadr9.webp" alt="">
      </div>
      <div class="caption"><span class="cap-step" id="capStep">Кадр 1</span><span id="capText"></span></div>
    </div>

    <div class="route" aria-hidden="true">
      <div class="rail"><div class="rail-done" id="railDone"></div></div>
      <div class="stops" id="stops"></div>
      <svg class="loco" id="loco"><use href="#i-loco"/></svg>
    </div>

    <p class="task" id="task"></p>
  </section>

  <section class="tickets-col">
    <div class="tickets-head">
      <h2>Билеты</h2>
      <p>Нажми на билет с <b>верным</b> фактом — и продвинешься в путешествии. Билет с ложным фактом порвётся.</p>
    </div>
    <ul class="tickets" id="tickets"></ul>
  </section>
</main>

<!-- Стартовый экран -->
<div class="overlay start" id="start">
  <div class="start-card">
    <div class="board small" id="startBoard"></div>
    <h2 id="startTitle"></h2>
    <p id="startTask"></p>
    <button class="go-ticket" id="goBtn" type="button">
      <span class="go-stub"><svg><use href="#i-train"/></svg></span>
      <span class="go-text">Начать посадку</span>
    </button>
  </div>
</div>

<!-- Финал -->
<div class="overlay final" id="final" aria-hidden="true">
  <div class="final-inner">
    <div class="board" id="finalBoard"></div>
    <div class="final-pic"><img src="img/kadr9.webp" alt="Счастливого пути!"></div>
    <p class="final-text" id="finalText"></p>
    <div class="final-actions">
      <button class="btn ghost" id="revealBtn" type="button">Порвать оставшиеся ложные билеты</button>
      <button class="btn" id="againBtn" type="button">Пройти ещё раз</button>
    </div>
  </div>
</div>

<audio id="announce" src="audio/obyavlenie.mp3" preload="auto"></audio>

<script src="facts.js"></script>
<script src="app.js"></script>
</body>
</html>
