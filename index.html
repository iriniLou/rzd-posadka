<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Посадка на скорый поезд</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e2231a'/%3E%3Crect x='9' y='6' width='14' height='16' rx='4' fill='%23fff'/%3E%3Crect x='11' y='9' width='10' height='5' rx='1.5' fill='%23e2231a'/%3E%3Cpath d='M10 27l3-4h6l3 4' stroke='%23fff' stroke-width='2' fill='none'/%3E%3C/svg%3E">
<!--
  «Внимание! Производится посадка на скорый поезд…» — интерактив для «Разговоров о важном», СПО 2–4 курсы.
  Исходники: эта папка (src). Тексты фактов — в facts.js.
  Этот файл собран автоматически (python build.py) — исходники в папке src.
-->
<style>
/* ───────── Палитра ───────── */
:root {
  --red: #e2231a;
  --red-dark: #b3151a;
  --paper: #f8f3ea;
  --paper-edge: #ece4d6;
  --ink: #1f2228;
  --muted: #5b6270;
  --board: #15171c;
  --amber: #ffb51f;
  --green: #17955a;
  --blue: #284b8f;
  --bg1: #dde6f1;
  --bg2: #f4f6f9;
  --radius: 18px;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Consolas", "Lucida Console", "Courier New", monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(1200px 600px at 15% 0%, #ffffffaa, transparent 60%),
    linear-gradient(180deg, var(--bg1), var(--bg2));
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 100dvh;
}
button { font: inherit; color: inherit; }

/* ───────── Шапка-табло ───────── */
.top {
  flex: none;
  display: flex; align-items: center; gap: 16px;
  padding: 10px clamp(12px, 2vw, 28px);
  background: var(--board);
  color: #fff;
  box-shadow: 0 4px 0 var(--red);
  position: relative; z-index: 5;
}
.logo {
  flex: none; width: 46px; height: 46px; border-radius: 12px;
  background: var(--red); color: #fff; display: grid; place-items: center;
}
.logo svg { width: 26px; height: 30px; --ico-cut: var(--red); }
.top h1 {
  flex: 1; margin: 0;
  font-size: clamp(16px, 1.75vw, 28px); font-weight: 800; line-height: 1.15;
  letter-spacing: .01em;
}
.counter {
  flex: none; display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); color: var(--amber);
  background: #000; border-radius: 10px; padding: 6px 12px;
  border: 1px solid #2c2f37;
}
.counter-label { font-size: 11px; line-height: 1.1; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
.counter-val { font-size: clamp(22px, 2vw, 32px); font-weight: 700; text-shadow: 0 0 10px #ffb51f88; }
.caption[hidden], .cap-step[hidden] { display: none; }
.counter.bump .counter-val { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.35); } }

.icon-btn {
  flex: none; width: 44px; height: 44px; border-radius: 12px;
  background: #ffffff14; border: 1px solid #ffffff22; color: #fff; cursor: pointer;
  display: grid; place-items: center;
}
.icon-btn svg { width: 24px; height: 24px; }
.icon-btn .cross { display: none; }
.icon-btn[aria-pressed="false"] .cross { display: inline; }
.icon-btn[aria-pressed="false"] .wave { display: none; }

/* ───────── Раскладка ───────── */
.layout {
  flex: 1; min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 48fr) minmax(0, 52fr);
  gap: clamp(14px, 2vw, 28px);
  padding: clamp(12px, 1.8vw, 26px);
}
.scene-col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.tickets-col { display: flex; flex-direction: column; min-height: 0; }

/* ───────── Картинка ───────── */
.scene {
  position: relative; width: 100%; aspect-ratio: 3 / 2;
  border-radius: var(--radius); overflow: hidden;
  background: #9fb7d6;
  box-shadow: 0 18px 40px -16px #1d2a4a88, 0 0 0 6px #fff;
}
.frames img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  opacity: 0; transition: opacity 1s ease;
  transform: scale(1.06);
}
.frames img.on { opacity: 1; animation: kenburns 14s ease-out forwards; }
@keyframes kenburns { from { transform: scale(1.06); } to { transform: scale(1.0) translate(0, -1%); } }
.scene.flash::after {
  content: ""; position: absolute; inset: 0; background: #fff;
  animation: flash .7s ease-out forwards; pointer-events: none;
}
@keyframes flash { from { opacity: .55; } to { opacity: 0; } }

.caption {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; gap: 12px;
  padding: 36px 18px 14px;
  background: linear-gradient(transparent, #0c1222d9);
  color: #fff; font-weight: 700; font-size: clamp(15px, 1.35vw, 22px);
}
.cap-step {
  flex: none; font-family: var(--mono); font-size: .75em; letter-spacing: .06em;
  background: var(--red); padding: 3px 8px; border-radius: 6px; text-transform: uppercase;
}
.caption.swap #capText { animation: capIn .6s ease-out; }
@keyframes capIn { from { opacity: 0; transform: translateY(10px); } }

/* ───────── Маршрут ───────── */
.route { position: relative; height: 54px; margin: 2px 24px 0 52px; flex: none; }
.rail {
  position: absolute; left: 0; right: 0; top: 34px; height: 6px; border-radius: 3px;
  background: repeating-linear-gradient(90deg, #b9c3d2 0 10px, #cfd7e2 10px 16px);
}
.rail-done {
  height: 100%; width: 0; border-radius: 3px; background: var(--red);
  transition: width 1s cubic-bezier(.5,0,.2,1);
}
.stops { position: absolute; left: 0; right: 0; top: 30px; height: 14px; }
.stop {
  position: absolute; top: 0; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%;
  background: #fff; border: 3px solid #b9c3d2; transition: border-color .4s, background .4s, transform .4s;
}
.stop.done { border-color: var(--red); background: var(--red); }
.stop.end { width: 20px; height: 20px; margin-left: -10px; top: -3px; }
.loco {
  position: absolute; top: 0; left: 0; width: 84px; height: 28px;
  transform: translateX(-50%); transition: left 1s cubic-bezier(.5,0,.2,1);
  filter: drop-shadow(0 3px 2px #0003);
}
.loco.chug { animation: chug .25s 4; }
@keyframes chug { 50% { translate: 0 -2px; } }

.task {
  margin: 0; padding: 14px 18px; border-radius: 14px;
  background: #fff; box-shadow: 0 6px 18px -10px #1d2a4a55;
  font-size: clamp(14px, 1.15vw, 19px); line-height: 1.35; font-weight: 600;
  border-left: 6px solid var(--red);
}

/* ───────── Список билетов ───────── */
.tickets-head { flex: none; display: flex; align-items: baseline; gap: 16px; padding: 0 4px 10px; flex-wrap: wrap; }
.tickets-head h2 { margin: 0; font-size: clamp(18px, 1.5vw, 24px); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.tickets-head p { margin: 0; flex: 1; min-width: 220px; font-size: clamp(13px, 1vw, 16px); color: var(--muted); }

.tickets {
  list-style: none; margin: 0; padding: 6px 10px 20px 4px;
  overflow-y: auto; overflow-x: hidden; min-height: 0;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px 18px; align-content: start;
  scrollbar-width: thin;
}
.slot { display: flex; flex-direction: column; gap: 8px; animation: dealIn .5s backwards; }
@keyframes dealIn { from { opacity: 0; transform: translateY(16px) rotate(-1deg); } }

/* ───────── Билет ───────── */
.tk {
  position: relative; display: block; width: 100%;
  padding: 0; border: 0; background: none; cursor: pointer; text-align: left;
  filter: drop-shadow(0 6px 8px #1d2a4a2e) drop-shadow(0 1px 1px #1d2a4a33);
  transition: transform .18s ease;
  --notch: 11px;
}
.tk:hover:not(:disabled) { transform: translateY(-3px) rotate(-.4deg); }
.tk:active:not(:disabled) { transform: translateY(0) scale(.985); }
.tk:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; border-radius: 12px; }
.tk:disabled { cursor: default; }

.half { display: block; transition: transform .7s cubic-bezier(.2,.8,.3,1), opacity .7s; }
.half.b { position: absolute; inset: 0; }

.face {
  display: grid; grid-template-columns: 58px minmax(0, 1fr) 44px;
  min-height: 118px; height: 100%;
  background:
    radial-gradient(circle at 20% 10%, #fff8 0, transparent 40%),
    var(--paper);
  border-radius: 10px;
  -webkit-mask:
    radial-gradient(circle var(--notch) at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle var(--notch) at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
          mask:
    radial-gradient(circle var(--notch) at 0 50%, #0000 97%, #000) left / 51% 100% no-repeat,
    radial-gradient(circle var(--notch) at 100% 50%, #0000 97%, #000) right / 51% 100% no-repeat;
  padding: 7px 0 7px 7px;
}
.stub {
  background: var(--red); color: #fff; border-radius: 6px 0 0 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
}
.stub svg { width: 24px; height: 28px; --ico-cut: var(--red); }
.stub .lines { width: 22px; height: 12px; background: repeating-linear-gradient(180deg, #fff 0 2px, transparent 2px 5px); border-radius: 1px; }
.body {
  border: 1.5px solid var(--red); border-left: 0;
  padding: 8px 12px 10px 14px;
  display: flex; flex-direction: column; gap: 3px; justify-content: center;
}
.tk-no {
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--red); font-weight: 700;
}
.tk-text { font-size: clamp(14px, 1.08vw, 18px); font-weight: 700; line-height: 1.25; color: var(--ink); }
.code {
  margin: 0 7px 0 0;
  border: 1.5px solid var(--red); border-left: 2px dashed var(--red); border-radius: 0 6px 6px 0;
  display: grid; place-items: center;
}
.code i {
  display: block; width: 18px; height: 70%;
  background: var(--bars, repeating-linear-gradient(180deg, #1f2228 0 2px, transparent 2px 4px, #1f2228 4px 7px, transparent 7px 9px));
  opacity: .85;
}

/* Штамп */
.stamp {
  position: absolute; z-index: 3; pointer-events: none;
  top: 50%; left: 54%;
  padding: 4px 14px; border-radius: 10px;
  font-family: var(--mono); font-weight: 800; font-size: clamp(16px, 1.4vw, 22px); letter-spacing: .12em;
  border: 3px solid currentColor; text-transform: uppercase;
  background: #fffffff0; box-shadow: 0 0 0 3px #fffffff0;
  transform: translate(-50%, -50%) rotate(-12deg) scale(2.4); opacity: 0;
}
.stamp.ok { color: var(--green); top: 24%; left: 82%; font-size: clamp(13px, 1.1vw, 18px); background: #ffffffd9; box-shadow: 0 0 0 3px #ffffffd9; }
.stamp.bad { color: var(--red-dark); left: 30%; }
.tk.is-ok .stamp.ok { animation: stampIn .35s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes stampIn { to { transform: translate(-50%, -50%) rotate(-12deg) scale(1); opacity: 1; } }

.tk.is-ok .face { background: #f3f8f1; }
.tk.is-ok { filter: drop-shadow(0 0 0 transparent) drop-shadow(0 2px 4px #17955a44); }

/* Разрыв */
.tk.shake { animation: shake .35s; }
@keyframes shake { 20% { transform: translateX(-5px) rotate(-1deg); } 40% { transform: translateX(5px) rotate(1deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
.tk.is-torn .half.a { transform: translate(-14px, 6px) rotate(-4deg); }
.tk.is-torn .half.b { transform: translate(16px, 12px) rotate(5deg); }
.tk.is-torn .half { opacity: .72; }
.tk.is-torn .face { filter: grayscale(.55) sepia(.15); }
.tk.is-torn .stamp.bad { animation: stampIn .35s .45s cubic-bezier(.3,1.6,.5,1) forwards; }
.tk.is-torn { filter: drop-shadow(0 3px 3px #1d2a4a22); }

/* Пояснение под билетом */
.note {
  margin: 4px 6px 0; padding: 10px 14px; border-radius: 12px;
  font-size: clamp(13px, 1vw, 16px); line-height: 1.35; font-weight: 600;
  animation: noteIn .45s .25s backwards;
}
.note b { display: block; font-size: .8em; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 2px; }
.note.ok { background: #e3f4ea; color: #0f5a37; border-left: 5px solid var(--green); }
.note.bad { background: #fdeaea; color: #7a1014; border-left: 5px solid var(--red); margin-top: 14px; }
@keyframes noteIn { from { opacity: 0; transform: translateY(-8px); } }

/* Летящий билетик */
.fly {
  position: fixed; z-index: 50; pointer-events: none; border-radius: 10px;
  background: linear-gradient(90deg, var(--red) 0 16%, var(--paper) 16%);
  box-shadow: 0 10px 30px #0005;
}

/* ───────── Табло (буквы-перевёртыши) ───────── */
.board { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px .8em; }
.board .word { display: flex; gap: 3px; }
.board .ch {
  position: relative; width: 1.15em; height: 1.6em; line-height: 1.6em; text-align: center;
  font-family: var(--mono); font-weight: 700; color: var(--amber);
  background: linear-gradient(#24272f 50%, #1b1d23 50%);
  border-radius: 4px; box-shadow: inset 0 -1px 0 #0008, 0 2px 0 #0006;
  text-shadow: 0 0 8px #ffb51f99;
}
.board .ch::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #000a; }
.board .ch.white { color: #fff; text-shadow: 0 0 8px #fff6; }
.board .ch.tick { animation: tick .08s; }
@keyframes tick { 50% { transform: scaleY(.6); } }

/* ───────── Оверлеи ───────── */
.overlay {
  position: fixed; inset: 0; z-index: 40;
  display: grid; place-items: center; padding: 20px;
  transition: opacity .6s, visibility .6s;
}
.overlay.hide { opacity: 0; visibility: hidden; pointer-events: none; }

.start { background: #0d1220cc; backdrop-filter: blur(6px); }
.start-card {
  width: min(760px, 100%); text-align: center; color: #fff;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
}
.start-card .board { font-size: clamp(12px, 1.6vw, 20px); }
.start-card h2 { margin: 0; font-size: clamp(26px, 3.4vw, 46px); line-height: 1.12; font-weight: 800; }
.start-card p { margin: 0; font-size: clamp(16px, 1.5vw, 22px); line-height: 1.4; opacity: .9; max-width: 620px; }

.go-ticket {
  margin-top: 8px; display: flex; align-items: stretch; cursor: pointer;
  border: 0; padding: 0; background: var(--paper); border-radius: 12px; overflow: hidden;
  box-shadow: 0 10px 0 #0006; transition: transform .15s, box-shadow .15s;
  --notch: 12px;
  -webkit-mask: radial-gradient(circle var(--notch) at 100% 50%, #0000 97%, #000);
          mask: radial-gradient(circle var(--notch) at 100% 50%, #0000 97%, #000);
}
.go-ticket:hover { transform: translateY(-3px) rotate(-1deg); }
.go-ticket:active { transform: translateY(4px); }
.go-stub { background: var(--red); color: #fff; width: 76px; display: grid; place-items: center; }
.go-stub svg { width: 30px; height: 34px; --ico-cut: var(--red); }
.go-text {
  padding: 22px 40px 22px 26px; font-size: clamp(20px, 2vw, 28px); font-weight: 800; color: var(--ink);
  text-transform: uppercase; letter-spacing: .06em; border-left: 2px dashed var(--red);
}

.final { background: radial-gradient(circle at 50% 40%, #1b2440, #070a12 75%); color: #fff; }
.final-inner {
  width: min(1100px, 100%); max-height: 100%;
  display: flex; flex-direction: column; align-items: center; gap: clamp(12px, 2vh, 22px);
}
.final .board { font-size: clamp(14px, 2.2vw, 30px); }
.final-pic {
  width: min(100%, calc((100dvh - 330px) * 1.5)); min-width: 260px; aspect-ratio: 3 / 2;
  border-radius: 20px; overflow: hidden; box-shadow: 0 0 0 6px #fff, 0 30px 80px -10px #000;
  transform: scale(.9); opacity: 0; transition: transform 1.2s cubic-bezier(.2,.8,.2,1), opacity 1s;
}
.final.show .final-pic { transform: none; opacity: 1; }
.final-pic img { width: 100%; height: 100%; object-fit: cover; animation: kenburns 16s ease-out forwards; }
.final-text { margin: 0; font-size: clamp(16px, 1.6vw, 24px); font-weight: 700; text-align: center; opacity: 0; transition: opacity .8s 1.2s; }
.final.show .final-text { opacity: 1; }
.final-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; opacity: 0; transition: opacity .8s 1.6s; }
.final.show .final-actions { opacity: 1; }

.btn {
  border: 0; cursor: pointer; border-radius: 14px; padding: 14px 24px;
  font-weight: 800; font-size: clamp(15px, 1.2vw, 19px);
  background: var(--red); color: #fff; box-shadow: 0 5px 0 var(--red-dark);
  transition: transform .1s, box-shadow .1s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--red-dark); }
.btn.ghost { background: #ffffff1a; box-shadow: 0 5px 0 #0007; border: 1px solid #ffffff33; }

/* Искры в финале */
.spark {
  position: fixed; z-index: 41; pointer-events: none; width: 10px; height: 14px; border-radius: 2px;
  animation: fall linear forwards;
}
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }

/* ───────── Узкие экраны ───────── */
@media (max-width: 1100px) {
  .tickets { grid-template-columns: 1fr; }
}
@media (max-width: 820px) {
  body { overflow: auto; height: auto; min-height: 100dvh; }
  .layout { grid-template-columns: 1fr; }
  .scene-col { position: sticky; top: 0; z-index: 4; background: var(--bg1); margin: -12px -12px 0; padding: 10px 12px 4px; gap: 8px; box-shadow: 0 8px 12px -10px #1d2a4a55; }
  .scene { aspect-ratio: auto; height: min(32vh, calc((100vw - 24px) / 1.5)); }
  .go-text { padding: 18px 20px; }
  .go-stub { width: 60px; }
  .start-card { gap: 14px; }
  .task { display: none; }
  .tickets { overflow: visible; }
  .counter-label { font-size: 9px; }
  .top { gap: 10px; }
  .logo { display: none; }
  .route { height: 46px; }
  .rail { top: 30px; } .stops { top: 26px; }
  .loco { width: 66px; height: 22px; }
  .route { margin-left: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<!-- Иконки -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-train" viewBox="0 0 48 56">
    <rect x="8" y="2" width="32" height="34" rx="9" fill="currentColor"/>
    <rect x="13" y="8" width="22" height="12" rx="3" fill="var(--ico-cut, #e2231a)"/>
    <circle cx="15" cy="28" r="3" fill="var(--ico-cut, #e2231a)"/>
    <circle cx="33" cy="28" r="3" fill="var(--ico-cut, #e2231a)"/>
    <path d="M14 40 7 52M34 40l7 12M12 47h24" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  </symbol>
  <symbol id="i-loco" viewBox="0 0 120 40">
    <path d="M6 8h70c18 0 30 8 38 22v4H6z" fill="#fff" stroke="#e2231a" stroke-width="3"/>
    <path d="M86 9c10 2 18 8 23 17H86z" fill="#e2231a"/>
    <rect x="14" y="14" width="12" height="9" rx="2" fill="#284b8f"/>
    <rect x="32" y="14" width="12" height="9" rx="2" fill="#284b8f"/>
    <rect x="50" y="14" width="12" height="9" rx="2" fill="#284b8f"/>
    <path d="M6 28h108" stroke="#e2231a" stroke-width="4"/>
    <circle cx="24" cy="36" r="3.5" fill="#1f2228"/><circle cx="44" cy="36" r="3.5" fill="#1f2228"/>
    <circle cx="80" cy="36" r="3.5" fill="#1f2228"/><circle cx="100" cy="36" r="3.5" fill="#1f2228"/>
  </symbol>
  <symbol id="i-sound" viewBox="0 0 24 24">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path class="cross" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
</svg>

<header class="top">
  <div class="logo"><svg><use href="#i-train"/></svg></div>
  <h1 id="title"></h1>
  <div class="counter" aria-live="polite">
    <span class="counter-label">найдено<br>верных билетов</span>
    <span class="counter-val"><b id="cnt">0</b></span>
  </div>
  <button class="icon-btn" id="soundBtn" type="button" aria-label="Звук" aria-pressed="true"><svg><use href="#i-sound"/></svg></button>
</header>

<main class="layout">
  <section class="scene-col">

<script>
(function () {
  "use strict";

  const Q = window.QUIZ;
  const $ = (s) => document.querySelector(s);
  const FRAMES = document.querySelectorAll("#frames img");
  const LAST = FRAMES.length - 1;                 // 8
  const TOTAL = Q.facts.filter((f) => f.ok).length;

  let found = 0;
  let finished = false;
  let soundOn = true;

  /* ───────── Звуковые эффекты (синтез, без файлов) ───────── */
  let ac = null;
  function ctx() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
    if (ac && ac.state === "suspended") ac.resume();
    return ac;
  }
  function noise(a, dur) {
    const buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.18 ? 1 : 0.35);
    const src = a.createBufferSource(); src.buffer = buf; return src;
  }
  function sfxTear() {
    const a = soundOn && ctx(); if (!a) return;
    const t = a.currentTime, src = noise(a, 0.45);
    const bp = a.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 0.8;
    bp.frequency.setValueAtTime(1800, t); bp.frequency.linearRampToValueAtTime(4200, t + 0.4);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    src.connect(bp).connect(g).connect(a.destination); src.start(t);
  }
  function sfxStamp() {
    const a = soundOn && ctx(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.15);
    const g = a.createGain(); g.gain.setValueAtTime(0.55, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.22);
    // «динь» — правильный ответ
    [880, 1318.5].forEach((f, i) => {
      const s = a.createOscillator(); s.type = "triangle"; s.frequency.value = f;
      const sg = a.createGain(), st = t + 0.08 + i * 0.09;
      sg.gain.setValueAtTime(0.0001, st); sg.gain.exponentialRampToValueAtTime(0.18, st + 0.01);
      sg.gain.exponentialRampToValueAtTime(0.0001, st + 0.5);
      s.connect(sg).connect(a.destination); s.start(st); s.stop(st + 0.55);
    });
  }

  /* ───────── Табло с буквами-перевёртышами ───────── */
  const ABC = "АБВГДЕЖЗИКЛМНОПРСТУФХЦЧШЭЮЯ0123456789";
  function flipBoard(el, text, whiteWords) {
    el.textContent = "";
    let k = 0;
    text.toUpperCase().split(" ").forEach((w, wi) => {
      const word = document.createElement("span"); word.className = "word";
      [...w].forEach((c) => {
        const ch = document.createElement("span");
        ch.className = "ch" + (whiteWords && whiteWords.includes(wi) ? " white" : "");
        ch.textContent = " ";
        word.appendChild(ch);
        const steps = 6 + k * 1.3 + Math.random() * 4;
        let n = 0;
        const timer = setInterval(() => {
          n++;
          ch.classList.remove("tick"); void ch.offsetWidth; ch.classList.add("tick");
          if (n >= steps) { ch.textContent = c; clearInterval(timer); }
          else ch.textContent = ABC[Math.floor(Math.random() * ABC.length)];
        }, 45);
        k++;
      });
      el.appendChild(word);
    });
  }

  /* ───────── Кадры и маршрут ───────── */
  function frameFor(n) { return Math.round((n / TOTAL) * LAST); }

  function setFrame(i, animate) {
    FRAMES.forEach((img, j) => {
      if (j === i) { img.classList.remove("on"); void img.offsetWidth; img.classList.add("on"); }
      else img.classList.remove("on");
    });
    const cap = $(".caption"), capText = Q.captions[i] || "";
    $("#capText").textContent = capText;
    $("#capStep").textContent = "Старт";
    $("#capStep").hidden = i !== 0;
    cap.hidden = !capText;
    cap.classList.remove("swap"); void cap.offsetWidth; cap.classList.add("swap");

    const pct = (i / LAST) * 100;
    $("#railDone").style.width = pct + "%";
    $("#loco").style.left = pct + "%";
    document.querySelectorAll(".stop").forEach((s, j) => s.classList.toggle("done", j <= i));
    if (animate) {
      const sc = $("#scene"); sc.classList.remove("flash"); void sc.offsetWidth; sc.classList.add("flash");
      const lo = $("#loco"); lo.classList.remove("chug"); void lo.getBoundingClientRect(); lo.classList.add("chug");
    }
  }

  function buildStops() {
    const box = $("#stops"); box.textContent = "";
    for (let i = 0; i <= LAST; i++) {
      const s = document.createElement("span");
      s.className = "stop" + (i === LAST ? " end" : "");
      s.style.left = (i / LAST) * 100 + "%";
      box.appendChild(s);
    }
  }

  /* ───────── Билеты ───────── */
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function tearPaths() {
    // Неровная линия разрыва: точки сверху вниз
    const base = 52 + Math.random() * 8, pts = [];
    const n = 12;
    for (let k = 0; k <= n; k++) {
      const y = (k / n) * 100;
      const x = base + (k % 2 ? 1 : -1) * (1 + Math.random() * 2.6) + (Math.random() - 0.5) * 1.5;
      pts.push([x.toFixed(2), y.toFixed(2)]);
    }
    const line = pts.map((p) => p[0] + "% " + p[1] + "%");
    const a = ["0 0", ...line, "0 100%"];
    const b = [...line, "100% 100%", "100% 0"];
    return ["polygon(" + a.join(",") + ")", "polygon(" + b.join(",") + ")"];
  }

  function barcode() {
    let pos = 0, out = [];
    while (pos < 100) {
      const bar = 1.5 + Math.random() * 4, gap = 1.5 + Math.random() * 3;
      out.push(`#1f2228 ${pos}% ${(pos + bar).toFixed(1)}%`, `transparent ${(pos + bar).toFixed(1)}% ${(pos + bar + gap).toFixed(1)}%`);
      pos += bar + gap;
    }
    return "linear-gradient(180deg," + out.join(",") + ")";
  }

  function makeFace(fact, no, bars) {
    const face = document.createElement("span"); face.className = "face";
    face.innerHTML =
      '<span class="stub"><svg><use href="#i-train"/></svg><span class="lines"></span></span>' +
      '<span class="body"><span class="tk-no"></span><span class="tk-text"></span></span>' +
      '<span class="code"><i></i></span>';
    face.querySelector(".tk-no").textContent = "Билет № " + String(no).padStart(2, "0");
    face.querySelector(".tk-text").textContent = fact.text;
    face.querySelector(".code i").style.setProperty("--bars", bars);
    return face;
  }

  function buildTickets() {
    const list = $("#tickets"); list.textContent = "";
    shuffle(Q.facts.slice()).forEach((fact, idx) => {
      const li = document.createElement("li"); li.className = "slot";
      li.style.animationDelay = idx * 45 + "ms";
      const btn = document.createElement("button");
      btn.type = "button"; btn.className = "tk";
      btn.setAttribute("aria-label", "Билет: " + fact.text);
      const [ca, cb] = tearPaths(), bars = barcode();

      const a = document.createElement("span"); a.className = "half a"; a.style.clipPath = ca; a.style.position = "relative";
      a.appendChild(makeFace(fact, idx + 1, bars));
      const bad = document.createElement("span"); bad.className = "stamp bad"; bad.textContent = "Ложь";
      a.appendChild(bad);
      const b = document.createElement("span"); b.className = "half b"; b.style.clipPath = cb; b.setAttribute("aria-hidden", "true");
      b.appendChild(makeFace(fact, idx + 1, bars));
      const ok = document.createElement("span"); ok.className = "stamp ok"; ok.textContent = "Верно";

      btn.append(a, b, ok);
      btn.addEventListener("click", () => pick(btn, li, fact));
      li.appendChild(btn);
      li._fact = fact; li._btn = btn;
      list.appendChild(li);
    });
  }

  function addNote(li, fact) {
    const n = document.createElement("div");
    n.className = "note " + (fact.ok ? "ok" : "bad");
    const h = document.createElement("b");
    h.textContent = fact.ok ? "✓ Верно!" : "✗ Неправда. Как на самом деле:";
    n.appendChild(h);
    if (fact.note) n.appendChild(document.createTextNode(fact.note));
    li.appendChild(n);
    setTimeout(() => n.scrollIntoView({ block: "nearest", behavior: "smooth" }), 500);
  }

  function tear(btn, li, fact, quiet) {
    btn.disabled = true;
    btn.classList.add("shake");
    setTimeout(() => {
      btn.classList.remove("shake");
      btn.classList.add("is-torn");
      if (!quiet) sfxTear();
      addNote(li, fact);
    }, 330);
  }

  function pick(btn, li, fact) {
    if (btn.disabled || finished) return;
    if (!fact.ok) { tear(btn, li, fact); return; }

    btn.disabled = true;
    btn.classList.add("is-ok");
    sfxStamp();
    addNote(li, fact);
    found++;
    const c = $(".counter"); $("#cnt").textContent = found;
    c.classList.remove("bump"); void c.offsetWidth; c.classList.add("bump");

    const last = found >= TOTAL;
    if (last) finished = true;        // больше ничего не нажимается, финал запускается один раз
    flyToScene(btn, () => {
      setFrame(frameFor(found), true);
      if (last) finish();
    });
  }

  function flyToScene(btn, done) {
    const r = btn.getBoundingClientRect(), t = $("#scene").getBoundingClientRect();
    const f = document.createElement("div"); f.className = "fly";
    Object.assign(f.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
    document.body.appendChild(f);
    const dx = t.left + t.width / 2 - (r.left + r.width / 2);
    const dy = t.top + t.height / 2 - (r.top + r.height / 2);
    if (!f.animate) { f.remove(); done(); return; }
    const anim = f.animate([
      { transform: "none", opacity: 0.95 },
      { transform: `translate(${dx * 0.45}px, ${dy * 0.45 - 70}px) scale(.55) rotate(-10deg)`, opacity: 0.95, offset: 0.45 },
      { transform: `translate(${dx}px, ${dy}px) scale(.08) rotate(-24deg)`, opacity: 0.2 }
    ], { duration: 750, easing: "cubic-bezier(.4,0,.6,1)" });
    let fired = false;
    const end = () => { if (fired) return; fired = true; f.remove(); done(); };
    anim.onfinish = end;
    setTimeout(end, 1100);   // страховка, если анимация не доиграет (свёрнутое окно и т.п.)
  }

  /* ───────── Финал ───────── */
  function remainingFalse() {
    return [...document.querySelectorAll(".slot")].filter((li) => !li._fact.ok && !li._btn.disabled);
  }

  function finish() {
    const au = $("#announce");
    if (soundOn) { au.currentTime = 0; const p = au.play(); if (p && p.catch) p.catch(() => {}); }
    setTimeout(() => {
      const fin = $("#final");
      fin.classList.remove("hide"); fin.setAttribute("aria-hidden", "false");
      requestAnimationFrame(() => fin.classList.add("show"));
      flipBoard($("#finalBoard"), Q.finalTitle, [1]);
      $("#finalText").textContent = Q.finalText;
      $("#revealBtn").style.display = remainingFalse().length ? "" : "none";
      sparks();
    }, 1800);
  }

  function sparks() {
    const colors = ["#e2231a", "#ffffff", "#ffb51f", "#284b8f"];
    for (let i = 0; i < 70; i++) {
      const s = document.createElement("i"); s.className = "spark";
      s.style.left = Math.random() * 100 + "vw";
      s.style.top = -20 - Math.random() * 30 + "vh";
      s.style.background = colors[i % colors.length];
      s.style.setProperty("--dx", (Math.random() - 0.5) * 30 + "vw");
      s.style.setProperty("--rot", Math.random() * 900 + "deg");
      s.style.animationDuration = 3 + Math.random() * 3 + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 6500);
    }
  }

  function closeFinal() {
    const fin = $("#final");
    fin.classList.remove("show"); fin.classList.add("hide"); fin.setAttribute("aria-hidden", "true");
  }

  function reset() {
    closeFinal();
    const au = $("#announce"); au.pause(); au.currentTime = 0;
    found = 0; finished = false;
    $("#cnt").textContent = "0";
    buildTickets();
    setFrame(0, false);
  }

  /* ───────── Запуск ───────── */
  $("#title").textContent = Q.title;
  $("#task").textContent = Q.task;
  $("#startTitle").textContent = Q.title;
  $("#startTask").textContent = Q.task;
  $("#final").classList.add("hide");
  buildStops();
  buildTickets();
  setFrame(0, false);
  flipBoard($("#startBoard"), "Посадка открыта");

  $("#goBtn").addEventListener("click", () => {
    ctx();
    // «Разблокируем» аудио на iOS/Safari тихим запуском — сам звук прозвучит только в финале
    const au = $("#announce"); au.muted = true;
    const p = au.play(); if (p && p.then) p.then(() => { au.pause(); au.currentTime = 0; au.muted = false; }).catch(() => { au.muted = false; });
    else { au.pause(); au.muted = false; }
    $("#start").classList.add("hide");
  });
  $("#againBtn").addEventListener("click", reset);
  $("#revealBtn").addEventListener("click", () => {
    closeFinal();
    remainingFalse().forEach((li, i) => setTimeout(() => tear(li._btn, li, li._fact, i > 0), 400 + i * 450));
  });
  $("#soundBtn").addEventListener("click", (e) => {
    soundOn = !soundOn;
    e.currentTarget.setAttribute("aria-pressed", String(soundOn));
    if (!soundOn) $("#announce").pause();
  });
})();
</script>
</body>
</html>
